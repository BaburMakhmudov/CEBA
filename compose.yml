services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ceba
      POSTGRES_PASSWORD: ceba_dev_only
      POSTGRES_DB: ceba
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ceba -d ceba']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pg_data:/var/lib/postgresql/data
  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - '4222:4222'
      - '8222:8222'
    volumes:
      - nats_data:/data
  ceba:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      DATABASE_URL: postgres://ceba:ceba_dev_only@postgres:5432/ceba
      NATS_URL: nats://nats:4222
    restart: 'no'
volumes:
  pg_data:
  nats_data:
