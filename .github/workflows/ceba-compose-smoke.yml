name: CEBA one-command Docker Compose smoke test
on:
  push:
    branches: ["build/ceba-runnable-runtime"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f compose.yml config --quiet
      - name: Build and run CEBA with single user command
        run: |
          set -o pipefail
          mkdir -p artifacts
          docker compose -f compose.yml up --build --abort-on-container-exit --exit-code-from ceba 2>&1 | tee artifacts/compose-first-run.log
      - name: Verify persistence across Docker Compose restart
        run: |
          set -o pipefail
          docker compose -f compose.yml up --abort-on-container-exit --exit-code-from ceba 2>&1 | tee artifacts/compose-second-run.log
      - name: Preserve output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ceba-compose-verification
          path: artifacts/
          if-no-files-found: warn
