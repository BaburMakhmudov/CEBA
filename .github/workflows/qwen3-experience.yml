name: Qwen3 reward-driven experience learning

on:
  push:
    branches:
      - experiment/qwen3-real-model
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen3-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference and learning dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 huggingface_hub safetensors
      - name: Run reward-only learning and held-out tests with real Qwen3 weights
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DOWNLOAD_TIMEOUT: '120'
        run: |
          set -o pipefail
          mkdir -p artifacts
          python experiments/qwen3_online_experience.py | tee artifacts/experience.json
      - name: Preserve measured evidence on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-online-experience
          path: artifacts/
          if-no-files-found: warn
