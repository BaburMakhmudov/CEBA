name: Qwen3 verified-state action loop

on:
  push:
    branches:
      - experiment/qwen3-real-model
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen3-verified-state:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pretrained model runtime
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 huggingface_hub safetensors
      - name: Run true pretrained model with versioned state and verified action
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DOWNLOAD_TIMEOUT: '120'
        run: |
          set -o pipefail
          mkdir -p artifacts
          python experiments/qwen3_verified_state_control.py | tee artifacts/verified_state.json
      - name: Preserve all evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-verified-state
          path: artifacts/
          if-no-files-found: warn
