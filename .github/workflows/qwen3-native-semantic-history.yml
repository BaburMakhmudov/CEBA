name: Native Qwen3 semantic history benchmark

on:
  push:
    branches:
      - experiment/qwen3-real-model
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-history:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual model runtime
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 huggingface_hub safetensors
      - name: Test pretrained semantic state and counterfactual no-history ablation
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DOWNLOAD_TIMEOUT: '120'
        run: |
          set -o pipefail
          mkdir -p artifacts
          python experiments/qwen3_native_semantic_history.py | tee artifacts/native_semantic_history.json
      - name: Preserve all results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-native-semantic-history
          path: artifacts/
          if-no-files-found: warn
